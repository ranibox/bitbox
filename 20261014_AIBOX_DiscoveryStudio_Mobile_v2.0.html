/* AI BOX Discovery Studio · Mobile — 단일 다크 룩(조명이 어두운 장소용). 텍스트는 흰색/밝은 회색만 사용. */
:root{--bg0:#0b1d58;--bg1:#071238;--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.2);
  --fg:#ffffff;--fg2:#e5e7eb;--acc:#4370ff;--accf:#3358e8;--ok:#44cc16;--warn:#ff9900;--bad:#ff3b30;
  --f:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#071238}
body{font-family:var(--f);color:var(--fg);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
#app{height:100%;position:relative;background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 100%);color:var(--fg);overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
b,strong{font-weight:700}
small{font-size:14px}

/* ── 공통 부품 ── */
.btn{min-height:48px;padding:0 18px;border-radius:14px;background:var(--accf);color:#fff;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent}
.btn.ghost{background:var(--card2);border-color:var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px;color:var(--fg2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.pill.ok i{background:var(--ok)}.pill.warn i{background:var(--warn)}.pill.bad i{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.mut{color:var(--fg2)}
h2{font-size:22px;margin:0;letter-spacing:-.02em}
h3{font-size:17px;margin:0;letter-spacing:-.01em}

/* ── 시작 화면 ── */
#vSetup{overflow-y:auto;-webkit-overflow-scrolling:touch}
.stin{max-width:560px;width:100%;margin:0 auto;padding-top:28px;padding-bottom:40px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:14px}
.orb{width:56px;height:56px;border-radius:17px;background:radial-gradient(circle at 30% 25%,#9db4ff 0%,#4370ff 45%,#1b2f9e 100%);display:grid;place-items:center;box-shadow:0 8px 30px rgba(67,112,255,.45);flex:none}
.orb svg{width:28px;height:28px}
.brand b{display:block;font-size:20px;letter-spacing:-.02em}
.brand span{font-size:15px;color:var(--fg2)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;color:var(--fg2);font-weight:600}
.fld input,#note{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.09);padding:10px 14px;font-size:16px;color:#fff;outline:none}
.fld input:focus,#note:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(67,112,255,.35)}
.fld input::placeholder,#note::placeholder{color:#c9ceda}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details.more summary{min-height:44px;display:flex;align-items:center;color:var(--fg2);font-weight:600;cursor:pointer;font-size:15px}
details.more[open] summary{margin-bottom:8px}
.cons{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--fg2);line-height:1.5}
.cons input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.savedh{font-size:14px;color:var(--fg2);font-weight:600;margin-top:6px}
.sl{display:flex;flex-direction:column;gap:8px}
.si{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.si b{font-size:16px}.si small{color:var(--fg2)}

/* ── 앱 셸 ── */
#vMain{display:grid;grid-template-rows:auto 1fr auto auto}
#hd{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line);background:rgba(7,18,56,.6)}
.sess{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:left}
.sess span{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess svg{width:20px;height:20px;flex:none}
.hrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg2)}
.pbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .4s}
#pn{font-weight:700;color:#fff;font-variant-numeric:tabular-nums;font-size:15px}
#clk{font-variant-numeric:tabular-nums}
#svTx{white-space:nowrap}
#sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,153,0,.18);border:1px solid var(--warn);border-radius:12px;padding:6px 8px 6px 12px;margin-top:8px;font-size:14px}
#mn{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:14px;padding-bottom:18px;min-height:0}
.pane{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}

/* 안내 카드 */
.guide{background:linear-gradient(160deg,#274ad0 0%,#17308f 100%);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gk{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;color:#fff}
.gk em{font-style:normal;color:var(--fg2);font-weight:400}
.gq{font-size:21px;font-weight:700;line-height:1.38;letter-spacing:-.02em}
.gh{font-size:15px;color:var(--fg2);line-height:1.5}
.gb{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.gb button{min-height:46px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-weight:600;font-size:15px}
.gb button.p{background:#fff;color:#0b1d58;border-color:#fff}
.gb button.on{border-color:#fff;background:rgba(255,255,255,.3)}

/* 기록 피드 */
.fh{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--fg2)}
.fh b{font-size:16px;color:#fff}
.feed{display:flex;flex-direction:column;gap:10px}
.u{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.u.q{background:rgba(67,112,255,.2);border-color:rgba(157,180,255,.55)}
.uh{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2)}
.uh b{color:#fff;font-size:14px}
.uh time{margin-left:auto;font-variant-numeric:tabular-nums}
.ut{margin:0;font-size:16px;line-height:1.55;color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:inline-flex;gap:6px;align-items:center;border-radius:999px;border:1px solid var(--line);padding:2px 10px;font-size:14px;color:#fff;background:rgba(255,255,255,.08);max-width:100%}
.ch u{text-decoration:none;font-size:13px;color:var(--fg2)}

  uniq(matches(SYS,text)).slice(0,3).forEach(function(x){add("","시스템",x)});
  uniq(matches(TERMS,text)).slice(0,2).forEach(function(x){add("","키워드",x)});

/* ── 기록 입력: 받아쓰기 자동 정리 ── */
function cvPrefix(v){var k=0,m=Math.min(cv.length,v.length);while(k<m&&cv.charAt(k)===v.charAt(k))k++;return k}
function ingest(txt,voice){
  txt=(txt||"").trim();if(!txt)return;
  /* 한 덩어리에 질문과 답이 섞여 있으면 문장 단위로 나눠 화자를 구분 */
  var cs=clauses(txt),groups=[];
  cs.forEach(function(c){var s=isQuestion(c)?"q":"a0";var g=groups[groups.length-1];if(g&&g.s===s)g.t+=" "+c;else groups.push({s:s,t:c})});
  if(!groups.length)groups=[{s:isQuestion(txt)?"q":"a0",t:txt}];
  groups.forEach(function(g){
    var spk=g.s==="q"?"q":(V.lastAns&&V.lastAns!=="q"?V.lastAns:"a0");
    V.spk=spk;if(spk!=="q")V.lastAns=spk;
    addUtt(spk,g.t,{nomerge:!voice});
  });
  changed();
}
function dictFlush(){
  var n=$("note"),v=n.value,k=cvPrefix(v),nw=v.slice(k).trim();
  if(!nw){if(!v){cv=""}return}
  ingest(nw,true);cv=v;
  if(v.length>600){n.value="";cv="";autoGrow()}
}
function submitNote(){
  clearTimeout(dictT);var n=$("note"),v=n.value,nw=v.slice(cvPrefix(v)).trim()||v.trim();
  if(nw)ingest(nw,false);n.value="";cv="";autoGrow();n.focus();
}
function autoGrow(){var n=$("note");n.style.height="auto";n.style.height=Math.min(120,Math.max(56,n.scrollHeight))+"px"}

function runSR(){
  if(!sttOn)return;
  var r=SRr=new SRc();r.lang="ko-KR";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;sttT0=Date.now();
  r.onresult=function(e){
    var fin="",it="";
    for(var i=e.resultIndex;i<e.results.length;i++){var res=e.results[i];if(res.isFinal)fin+=res[0].transcript+" ";else it+=res[0].transcript}
    if(it)$("sttline").textContent="듣는 중 · "+it;
    if(fin.trim()){sttFail=0;ingest(fin,true);$("sttline").textContent="듣는 중…"}
  };
  r.onerror=function(e){
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){sttOn=false;sttBad=true;paintMic();toast("마이크 권한이 없거나 이 환경에서 막혀 있습니다. 키보드 받아쓰기를 쓰세요.",true)}
    else if(e.error==="network"){sttOn=false;paintMic();toast("음성 인식 서버에 연결할 수 없습니다. 인터넷을 확인하세요.",true)}
  };
  r.onend=function(){
    if(!sttOn)return;
    if(Date.now()-sttT0<700){if(++sttFail>=6){sttOn=false;paintMic();toast("음성 인식이 계속 끊깁니다. 주변이 시끄러우면 키보드 받아쓰기가 더 안정적입니다.",true);return}}
    setTimeout(runSR,250);
  };

}

  else if(a==="open")openSession(id);

      if(CUR&&CUR.id===id){resetState();closeSheet();show("setup")}delArm="";paintSheet();paintSaved()}
    else{delArm=id;paintSheet()}
  }
});
